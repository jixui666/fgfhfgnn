name: Build blocker.dylib

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          # Download the SDK straight from the release asset: theos' install-sdk
          # goes through api.github.com, which is rate-limited on CI runners.
          curl -fL -o /tmp/iPhoneOS16.5.sdk.tar.xz \
            https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz
          mkdir -p "$THEOS/sdks"
          tar -xJf /tmp/iPhoneOS16.5.sdk.tar.xz -C "$THEOS/sdks"
          ls -d "$THEOS"/sdks/*.sdk

      - name: Install tools
        run: brew install ldid

      - name: Build
        run: |
          make clean
          make

      - name: Collect dylib
        run: |
          mkdir -p out
          find .theos layout -name '*.dylib' -exec cp {} out/ \;
          ls -l out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: blocker-dylib
          path: out/*.dylib
          if-no-files-found: error
